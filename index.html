<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ScamRadar — AI scam detection</title>
<style>
  :root {
    --bg: #0a0f1a;
    --panel: #121a2b;
    --panel-2: #1a2340;
    --border: #233155;
    --text: #e7ecf5;
    --muted: #8b97b3;
    --accent: #4F8EF7;
    --accent-2: #6ea4ff;
    --danger: #ef4444;
    --warn: #f59e0b;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  a { color: var(--accent); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  textarea, input[type=url], input[type=text] {
    width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; outline: none; resize: vertical;
  }
  textarea { min-height: 120px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 18px;
    font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button.secondary { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .check input { accent-color: var(--accent); }
  .verdict { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .badge { padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 13px; letter-spacing: 0.3px; }
  .b-scam { background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid rgba(239,68,68,.4); }
  .b-likely { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid rgba(245,158,11,.4); }
  .b-sus { background: rgba(245,158,11,.1); color: #fbbf24; border: 1px solid rgba(245,158,11,.3); }
  .b-ok { background: rgba(34,197,94,.15); color: var(--ok); border: 1px solid rgba(34,197,94,.4); }
  .conf { color: var(--muted); font-size: 13px; }
  .summary { color: var(--text); margin: 6px 0 12px; }
  .flag { display: flex; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--panel-2); }
  .sev { width: 8px; border-radius: 4px; flex-shrink: 0; }
  .sev.high { background: var(--danger); }
  .sev.medium { background: var(--warn); }
  .sev.low { background: #64748b; }
  .flag-title { font-weight: 600; font-size: 14px; }
  .flag-exp { color: var(--muted); font-size: 13px; margin-top: 2px; }
  ul.advice { padding-left: 20px; margin: 8px 0 0; }
  ul.advice li { margin: 4px 0; }
  .footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  .preview { margin-top: 12px; max-width: 100%; border-radius: 10px; border: 1px solid var(--border); }
  .err { color: var(--danger); margin-top: 10px; font-size: 13px; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span> ScamRadar</div>
    <div class="sub">Powered by AI</div>
  </header>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-mode="text">Paste text</button>
      <button class="tab" data-mode="url">Check URL</button>
      <button class="tab" data-mode="image">Upload screenshot</button>
    </div>

    <div id="pane-text">
      <textarea id="textInput" placeholder="Paste the suspicious message here..."></textarea>
    </div>
    <div id="pane-url" style="display:none">
      <input id="urlInput" type="url" placeholder="https://example.com/suspicious-link" />
    </div>
    <div id="pane-image" style="display:none">
      <input id="imageInput" type="file" accept="image/*" />
      <img id="imagePreview" class="preview" style="display:none" alt="" />
      <div class="sub" style="margin-top:8px">AI reads text directly from the screenshot.</div>
    </div>

    <div class="row">
      <label class="check"><input type="checkbox" id="deep" /> Deep analysis</label>
      <div style="flex:1"></div>
      <button id="scanBtn">Scan</button>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div id="resultCard" class="card" style="display:none">
    <div class="verdict">
      <span id="verdictBadge" class="badge"></span>
      <span class="conf" id="confidence"></span>
      <div style="flex:1"></div>
      <button class="secondary" id="easyBtn">👵 Easy Read</button>
    </div>
    <div class="sub" id="scamType"></div>
    <div class="summary" id="summary"></div>
    <div id="flags"></div>
    <h4 style="margin:14px 0 4px">Advice</h4>
    <ul class="advice" id="advice"></ul>
  </div>

  <div class="footer">ScamRadar · Standalone build · Set GEMINI_API_KEY to enable scanning</div>
</div>

<script>
  let mode = "text";
  let imageData = null;
  let lastResult = null;
  let easy = false;

  const $ = (id) => document.getElementById(id);

  document.querySelectorAll(".tab").forEach((t) => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
      t.classList.add("active");
      mode = t.dataset.mode;
      $("pane-text").style.display = mode === "text" ? "" : "none";
      $("pane-url").style.display  = mode === "url"  ? "" : "none";
      $("pane-image").style.display = mode === "image" ? "" : "none";
    });
  });

  $("imageInput").addEventListener("change", (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      imageData = reader.result;
      const p = $("imagePreview");
      p.src = imageData;
      p.style.display = "block";
    };
    reader.readAsDataURL(file);
  });

  function verdictClass(v) {
    if (v === "SCAM") return "b-scam";
    if (v === "LIKELY SCAM") return "b-likely";
    if (v === "SUSPICIOUS") return "b-sus";
    return "b-ok";
  }

  function render(result) {
    $("resultCard").style.display = "";
    const badge = $("verdictBadge");
    badge.className = "badge " + verdictClass(result.verdict);
    badge.textContent = easy && result.verdictLabel ? result.verdictLabel : result.verdict;
    $("confidence").textContent = result.confidence != null ? `${result.confidence}% confidence` : "";
    $("scamType").textContent = result.scamType ? `Type: ${result.scamType}` : "";
    $("summary").textContent = result.summary || "";
    const flags = $("flags");
    flags.innerHTML = "";
    (result.redFlags || []).forEach((f) => {
      const el = document.createElement("div");
      el.className = "flag";
      el.innerHTML = `<div class="sev ${f.severity}"></div>
        <div><div class="flag-title">${f.flag}</div><div class="flag-exp">${f.explanation}</div></div>`;
      flags.appendChild(el);
    });
    const adv = $("advice");
    adv.innerHTML = "";
    (result.advice || []).forEach((a) => {
      const li = document.createElement("li");
      li.textContent = a;
      adv.appendChild(li);
    });
  }

  $("scanBtn").addEventListener("click", async () => {
    $("err").textContent = "";
    let content = "";
    if (mode === "text") content = $("textInput").value.trim();
    else if (mode === "url") content = $("urlInput").value.trim();
    else if (mode === "image") content = imageData || "";
    if (!content) { $("err").textContent = "Please provide input."; return; }

    const btn = $("scanBtn");
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Scanning...';
    try {
      const res = await fetch("/api/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode, content, deep: $("deep").checked }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Scan failed");
      lastResult = json; easy = false;
      $("easyBtn").textContent = "👵 Easy Read";
      render(json);
    } catch (e) {
      $("err").textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Scan";
    }
  });

  $("easyBtn").addEventListener("click", async () => {
    if (!lastResult) return;
    if (easy) {
      easy = false;
      $("easyBtn").textContent = "👵 Easy Read";
      render(lastResult);
      return;
    }
    const btn = $("easyBtn");
    btn.disabled = true; btn.textContent = "Simplifying...";
    try {
      const res = await fetch("/api/simplify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ result: lastResult }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Simplify failed");
      easy = true;
      $("easyBtn").textContent = "Original view";
      render({ ...lastResult, ...json });
    } catch (e) {
      $("err").textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
